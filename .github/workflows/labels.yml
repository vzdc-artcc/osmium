name: Sync labels

on:
  push:
    branches:
      - master
    paths:
      - .github/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run labeler
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          # Labels absent from labels.yml are left alone rather than deleted, so
          # GitHub's default labels survive on historical issues. Flip this only
          # after those issues have been re-labelled.
          skip-delete: true
          dry-run: false
