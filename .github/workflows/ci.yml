name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check advisories, licences, bans and sources
        # Config: deny.toml. Runs on every PR, so an advisory published against a locked crate
        # fails the next PR rather than going unnoticed.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The history scan reads every commit, not only the PR's head.
          fetch-depth: 0

      - name: Install gitleaks
        # The release binary, checksum-pinned, rather than gitleaks-action, which needs a paid
        # licence on organization repos. Keep the version in step with just/secrets.just.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan for secrets
        # Full history: a key in an old commit is still a leaked key. Config: .gitleaks.toml.
        run: gitleaks git --log-opts=--all . --redact --no-banner

      - name: Test git hooks
        run: bash .githooks/tests/test_commit_msg.sh

  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        # rustup installs the toolchain pinned in rust-toolchain.toml.
        run: rustup toolchain install

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    needs: fmt

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        # rustup installs the toolchain pinned in rust-toolchain.toml.
        run: rustup toolchain install

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        # db-migrator is a one-shot migration tool (built/shipped only via the
        # Dockerfile); it must not gate the osmium build/CI.
        run: cargo check --workspace --exclude db-migrator --all-targets

  test:
    runs-on: ubuntu-latest
    needs: check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: osmium_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d osmium_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/osmium_ci
      FILE_STORAGE_ROOT: /tmp/osmium-files
      FILE_SIGNING_SECRET: test-signing-secret
      CDN_BASE_URL: http://127.0.0.1:3000
      EMAIL_UNSUBSCRIBE_SECRET: test-unsub-secret
      EMAIL_UNSUBSCRIBE_BASE_URL: http://127.0.0.1:3000
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      VATSIM_DEV_MODE: "false"
      DEV_LOGIN_AS_CID_ENABLED: "false"
      DEV_SEED_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        # rustup installs the toolchain pinned in rust-toolchain.toml.
        run: rustup toolchain install

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        # See the check job: db-migrator is excluded from osmium CI.
        run: cargo test --workspace --exclude db-migrator --all-targets -- --test-threads=1
