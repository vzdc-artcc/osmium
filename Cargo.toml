[package]
name = "osmium"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lints]
workspace = true

[workspace]
members = [
    ".",
    # One-shot legacy->osmium migration tool. Kept a workspace member so the
    # Dockerfile (`cargo build -p db-migrator`) and the migration-test compose can
    # still build/ship it, but excluded from the osmium CI check/test jobs (see
    # .github/workflows/ci.yml) so its tests and compile time don't gate osmium.
    "tools/db-migrator",
]
exclude = [
    "tools/api-load-tester",
]
resolver = "2"

# Lint levels for every workspace member and target. The rustc lints fail `cargo check`; the
# clippy lints apply wherever `cargo clippy` runs.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# A lint is silenced with `#[expect(lint, reason = "...")]`, which also fails once the lint
# stops firing, rather than a bare `#[allow]`.
allow_attributes_without_reason = "deny"
unwrap_used = "warn"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
dotenvy = "0.15.7"
http = "1.3.1"
aws-config = "1.8.10"
# Default features minus `rustls`, which selects the legacy hyper 0.14 client and with it
# rustls 0.21, rustls-webpki 0.101 and h2 0.3. `default-https-client` is the hyper 1 /
# rustls 0.23 client the rest of the SDK already uses.
aws-sdk-sesv2 = { version = "1.91.0", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "form", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "macros", "migrate", "chrono", "uuid"] }
thiserror = "2.0.17"
time = "0.3.44"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
# spec 010 IP rate limiting. tower_governor's GovernorLayer is a sync tower layer and
# cannot run the async, DB-backed permission-bypass the spec's own algorithm requires
# (permission check only *after* an IP is over its limit). We therefore use governor —
# the exact keyed limiter tower_governor wraps (tower_governor 0.8 pins governor 0.10) —
# directly inside a custom `from_fn` middleware (src/rate_limit.rs). Same engine, but the
# hot-path/bypass control flow lives in our code. See src/rate_limit.rs for the rationale.
governor = "0.10"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
sha2 = "0.11.0"
hmac = "0.13.0"
aes-gcm = "0.10.3"
getrandom = "0.4.2"
pulldown-cmark = "0.13.3"
maud = "0.27.0"
# Inlines the email templates' <style> class rules onto elements so email clients
# that strip <style> (Gmail/Outlook) still render the brand colors. default-features
# off — we never load remote stylesheets during render.
css-inline = { version = "0.16", default-features = false }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
base64 = "0.22.1"
urlencoding = "2.1.3"
# FAA preferred-routes ingest (Worker B) — unzip the NASR PFR CSV bundle. Only the
# deflate codec is needed; default features (bzip2/zstd/aes) are disabled to keep
# the dependency surface minimal. `deflate-flate2-zlib-rs` (pure Rust) decompresses only; zip's `deflate`
# feature also pulls zopfli for compression, which the ingest never does.
zip = { version = "9.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
