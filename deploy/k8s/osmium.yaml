# =============================================================================
# Osmium — Kubernetes manifest (paste into Portainer → Add application → From
# manifest, or apply with `kubectl apply -f osmium.yaml`).
#
# This file is just the resources you deploy: PVC + Deployment + Service. All env
# is managed in Portainer as separate objects (same as the website), referenced
# here by name via envFrom:
#   - osmium-config  → ConfigMap of non-secret env  (see osmium-config.example.yaml)
#   - osmium-secret  → osmium's own app secrets      (see osmium-secret.example.yaml)
#   - db-secret      → shared: Postgres host/port/user/password
#   - email-secret   → shared: AWS SES credentials
#
# BEFORE DEPLOYING (all in the `default` namespace):
#   1. Run deploy/k8s/postgres-setup.sql once (creates the `osmium` database).
#   2. Create the `osmium-config` ConfigMap  (Portainer → Configurations).
#   3. Create the `osmium-secret` Secret      (Portainer → Configurations).
#   4. Confirm the shared `db-secret` + `email-secret` exist (they already do —
#      the website uses them).
#   5. Get osmium a public hostname routed to this Service, and register the
#      VATSIM + Discord OAuth callbacks (see README.md Step 4).
#
# There are no REPLACE_ placeholders in this file — they all live in the
# osmium-config ConfigMap you create in step 2.
# =============================================================================
---
# -----------------------------------------------------------------------------
# Persistent storage for uploaded files (FILE_STORAGE_ROOT). ReadWriteOnce, so
# keep the Deployment at 1 replica. On DigitalOcean Kubernetes this binds to the
# default `do-block-storage` StorageClass automatically (provisions a DO Block
# Storage volume) — no action needed. Set storageClassName below only to override.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: osmium-files
  namespace: default
  labels:
    app: osmium
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: do-block-storage   # DOKS default; uncomment only to pin/override
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osmium
  namespace: default
  labels:
    app: osmium
spec:
  # Keep at 1: the files PVC is ReadWriteOnce and migrations run on startup.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: osmium
  template:
    metadata:
      labels:
        app: osmium
    spec:
      containers:
        - name: osmium
          image: ghcr.io/vzdc-artcc/osmium:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          # Build DATABASE_URL from the shared db-secret (same as the website),
          # but hardcode the `osmium` database so it can never point at the
          # website's DB. This explicit env overrides any DATABASE_URL that a
          # referenced secret might also define.
          env:
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/osmium
          # Order matters: later sources win on key collisions.
          envFrom:
            - configMapRef:
                name: osmium-config
            - secretRef:
                name: db-secret      # shared: POSTGRES_USER/PASSWORD/HOST/PORT
            - secretRef:
                name: email-secret   # shared: AWS SES creds
            - secretRef:
                name: osmium-secret  # osmium's own app secrets
          volumeMounts:
            - name: files
              mountPath: /app/storage/files
          # Startup probe covers first-boot migrations before liveness kicks in.
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: osmium-files
---
apiVersion: v1
kind: Service
metadata:
  name: osmium
  namespace: default
  labels:
    app: osmium
spec:
  type: ClusterIP
  selector:
    app: osmium
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000
# -----------------------------------------------------------------------------
# No Ingress here — external exposure (the DigitalOcean load balancer + TLS) is
# handled at a layer outside this namespace, exactly like the website. Whoever
# manages the LB routes osmium's public hostname to this `osmium` Service on port
# 3000 (the same way the `website` Service is wired). Give them:
#   - the hostname you want (it's the REPLACE_OSMIUM_HOST value in osmium-config)
#   - Service: osmium, namespace default, port 3000
# The hostname must be decided before you fill in the redirect URIs in
# osmium-config and register them with VATSIM/Discord (Step 4 in README.md).
# -----------------------------------------------------------------------------
