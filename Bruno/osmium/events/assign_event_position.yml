info:
  name: assign_event_position
  type: http
  seq: 10
  tags:
    - events

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/events/:event_id/positions/:position_id"
  params:
    - name: event_id
      value: ""
      type: path
      description: Event ID
    - name: position_id
      value: ""
      type: path
      description: Position ID
  body:
    type: json
    data: |-
      {
        "user_id": "",
        "final_position": "PCT_APP",
        "final_start_time": "2026-05-20T15:00:00Z",
        "final_end_time": "2026-05-20T18:00:00Z",
        "controlling_category": "TERMINAL",
        "is_instructor": false,
        "published": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
