  url: "{{baseUrl}}/api/v1/events/:event_id/ops-plan/files"
  params:
    - name: event_id
      value: ""
      type: path
      description: Event ID
  body:
    type: json
    data: |-
      {
        "asset_id": null,
        "filename": "ops-notes.pdf",
        "url": "https://example.com/ops-notes.pdf",
        "file_type": "application/pdf"
      }
  auth: inherit

settings:
