    description: File imported
    request:
      url: "{{baseUrl}}/api/v1/files/import"
      method: POST
      params:
        - name: public
          value: ""
          type: query
          description: Whether the file is public
          disabled: true
        - name: owner_cid
          value: ""
          type: query
          description: Optional owner CID
