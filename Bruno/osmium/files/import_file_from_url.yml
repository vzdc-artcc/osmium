          type: query
          description: Comma-separated viewer CIDs
          disabled: true
        - name: viewer_roles
          value: ""
          type: query
          description: Comma-separated viewer roles
          disabled: true
      body:
        type: json
        data: |-
          {
            "url": "https://example.com/banner.png",
            "filename": "banner.png"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "content_type": "",
            "created_at": "",
