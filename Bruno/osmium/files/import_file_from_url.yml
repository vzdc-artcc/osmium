info:
  name: import_file_from_url
  type: http
  seq: 4
  tags:
    - files

http:
  method: POST
  url: "{{baseUrl}}/api/v1/files/import"
  params:
    - name: public
      value: ""
      type: query
      description: Whether the file is public
      disabled: true
    - name: owner_cid
      value: ""
      type: query
      description: Optional owner CID
      disabled: true
    - name: viewer_cids
      value: ""
      type: query
      description: Comma-separated viewer CIDs
      disabled: true
    - name: viewer_roles
      value: ""
      type: query
      description: Comma-separated viewer roles
      disabled: true
  body:
    type: json
    data: |-
      {
        "url": "https://example.com/banner.png",
        "filename": "banner.png"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
