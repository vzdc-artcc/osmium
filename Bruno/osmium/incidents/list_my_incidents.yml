info:
  name: list_my_incidents
  type: http
  seq: 2
  tags:
    - incidents

http:
  method: GET
  url: "{{baseUrl}}/api/v1/incidents"
  params:
    - name: limit
      value: "25"
      type: query
      disabled: true
    - name: offset
      value: "0"
      type: query
      disabled: true
    - name: closed
      value: "false"
      type: query
      disabled: true
    - name: reporter_cid
      value: ""
      type: query
      description: Filter by reporter CID (exact match)
      disabled: true
    - name: reporter_name
      value: ""
      type: query
      description: Filter by reporter display name (contains)
      disabled: true
    - name: reportee_cid
      value: ""
      type: query
      description: Filter by reportee CID (exact match)
      disabled: true
    - name: reportee_name
      value: ""
      type: query
      description: Filter by reportee display name (contains)
      disabled: true
  headers:
    - name: X-Response-Timezone
      value: "{{responseTimezone}}"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
