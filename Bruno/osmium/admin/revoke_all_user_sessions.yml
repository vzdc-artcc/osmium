info:
  name: revoke_all_user_sessions
  type: http
  seq: 11
  tags:
    - admin

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/admin/users/:cid/sessions"
  params:
    - name: cid
      value: ""
      type: path
      description: VATSIM CID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0

docs: |
  Revokes ALL of a user's active sessions (SERVER_ADMIN only,
  users.sessions.delete). Takes effect immediately and is audited. Returns the
  (now empty) active-session list.
