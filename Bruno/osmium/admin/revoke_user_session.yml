info:
  name: revoke_user_session
  type: http
  seq: 10
  tags:
    - admin

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/admin/users/:cid/sessions/:session_id"
  params:
    - name: cid
      value: ""
      type: path
      description: VATSIM CID
    - name: session_id
      value: ""
      type: path
      description: Session id to revoke
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0

docs: |
  Revokes one of a user's sessions (SERVER_ADMIN only, users.sessions.delete).
  Takes effect immediately and is audited. Returns the remaining active sessions.
