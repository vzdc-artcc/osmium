info:
  name: list_event_position_presets
  type: http
  seq: 1
  tags:
    - events

http:
  method: GET
  url: "{{baseUrl}}/api/v1/event-position-presets"
  params:
    - name: page
      value: ""
      type: query
      description: Page number
      disabled: true
    - name: page_size
      value: ""
      type: query
      description: Items per page
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Paginated list of event position presets
    request:
      url: "{{baseUrl}}/api/v1/event-position-presets"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "id": "",
                "name": "",
                "positions": [],
                "created_at": "",
                "updated_at": ""
              }
            ],
            "total": 0,
            "page": 1,
            "page_size": 25,
            "total_pages": 0,
            "has_next": false,
            "has_prev": false
          }
  - name: 401 Response
    description: Not authorized
    request:
      url: "{{baseUrl}}/api/v1/event-position-presets"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
