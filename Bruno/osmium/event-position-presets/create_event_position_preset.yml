info:
  name: create_event_position_preset
  type: http
  seq: 3
  tags:
    - events

http:
  method: POST
  url: "{{baseUrl}}/api/v1/event-position-presets"
  body:
    type: json
    data: |-
      {
        "name": "Standard DCA/PCT",
        "positions": ["DCA_GND", "DCA_TWR", "PCT_APP"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Event position preset created
    request:
      url: "{{baseUrl}}/api/v1/event-position-presets"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Standard DCA/PCT",
            "positions": ["DCA_GND", "DCA_TWR", "PCT_APP"]
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "positions": [],
            "created_at": "",
            "updated_at": ""
          }
  - name: 400 Response
    description: Invalid request
    request:
      url: "{{baseUrl}}/api/v1/event-position-presets"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "positions": []
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Not authorized
    request:
      url: "{{baseUrl}}/api/v1/event-position-presets"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "positions": []
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
