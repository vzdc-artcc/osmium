        data: |-
          {
            "comments": "",
            "controller_position": "",
            "decided_at": "",
            "decided_by": "",
            "id": "",
            "pilot_callsign": "",
            "rating": 0,
            "staff_comments": "",
            "status": "",
            "submitted_at": "",
            "submitter_user_id": "",
            "submitter_cid": 0,
