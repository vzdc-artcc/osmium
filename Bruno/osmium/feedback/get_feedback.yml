info:
  name: get_feedback
  type: http
  seq: 3
  tags:
    - feedback

http:
  method: GET
  url: "{{baseUrl}}/api/v1/feedback/:feedback_id"
  params:
    - name: feedback_id
      value: ""
      type: path
      description: Feedback record ID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
