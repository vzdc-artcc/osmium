info:
  name: list_feedback
  type: http
  seq: 1
  tags:
    - feedback

http:
  method: GET
  url: "{{baseUrl}}/api/v1/feedback"
  params:
    - name: limit
      value: ""
      type: query
      description: Maximum rows
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Pagination offset
      disabled: true
    - name: status
      value: ""
      type: query
      description: Optional feedback status
      disabled: true
    - name: submitter_cid
      value: ""
      type: query
      description: Filter by submitter CID (exact match)
      disabled: true
    - name: submitter_name
      value: ""
      type: query
      description: Filter by submitter display name (contains)
      disabled: true
    - name: target_cid
      value: ""
      type: query
      description: Filter by target CID (exact match)
      disabled: true
    - name: target_name
      value: ""
      type: query
      description: Filter by target display name (contains)
      disabled: true
    - name: controller_position
      value: ""
      type: query
      description: Filter by staffed position (contains)
      disabled: true
    - name: min_rating
      value: ""
      type: query
      description: Minimum rating (inclusive)
      disabled: true
    - name: max_rating
      value: ""
      type: query
      description: Maximum rating (inclusive)
      disabled: true
  headers:
    - name: X-Response-Timezone
      value: "{{responseTimezone}}"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

