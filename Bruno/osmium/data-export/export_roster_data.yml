info:
  name: export_roster_data
  type: http
  seq: 2
  tags:
    - data-export

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/data-export/roster"
  headers:
    - name: X-Response-Timezone
      value: "{{responseTimezone}}"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Admin bulk export (SERVER_ADMIN only, users.data_export.read — granted to no role
  and kept out of the assignable catalog). Returns a MassDataExportDocument: the
  full personal-data document for every on-roster controller in one payload,
  ordered by CID. Recorded as a single DATA_EXPORT / EXPORT_ALL audit entry and
  capped by its own dedicated rate limiter (tighter than the per-user export).

examples:
  - name: 200 Response
    description: Every on-roster controller's export document
    request:
      url: "{{baseUrl}}/api/v1/admin/data-export/roster"
      method: GET
      headers:
        - name: X-Response-Timezone
          value: "{{responseTimezone}}"
          disabled: true
    response:
      status: 200
      statusText: OK
  - name: 401 Response
    description: Not authenticated or missing users.data_export.read
    request:
      url: "{{baseUrl}}/api/v1/admin/data-export/roster"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
